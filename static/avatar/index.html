<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Avatar</title>
  <!-- Azure Speech SDK (browser build). Drives the real-time TTS avatar over WebRTC. -->
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      padding: 10px;
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1a1a1a; background: #fff;
    }
    #stage {
      position: relative; width: 100%; height: 440px;
      background: #0e1116; border-radius: 12px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    /* contain (not cover) so the whole avatar/face is visible, never cropped */
    #stage video { width: 100%; height: 100%; object-fit: contain; background: #0e1116; }
    #placeholder {
      position: absolute; color: #8a93a6; font-size: 13px; text-align: center; padding: 0 16px;
    }
    .controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      padding: 6px 14px; border-radius: 8px; border: 1px solid #ccc;
      background: #f6f6f6; cursor: pointer; font: inherit;
    }
    button.primary { background: #1668dc; border-color: #1668dc; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #status { font-size: 13px; color: #666; }
    #answer {
      margin-top: 10px; white-space: pre-wrap; max-height: 120px; overflow-y: auto;
      font-size: 13px; color: #333;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="placeholder">Connecting to the avatar…</div>
    <!-- video/audio elements are injected on connect (pc.ontrack) -->
  </div>
  <div class="controls">
    <button id="enable-sound" class="primary" style="display:none">🔊 Enable sound</button>
    <button id="reconnect" style="display:none">↻ Reconnect</button>
    <button id="disconnect" style="display:none">⏹ Disconnect</button>
    <span id="status">starting…</span>
  </div>
  <div id="answer"></div>
  <script src="/static/avatar/avatar.js"></script>
</body>
</html>
